<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sort</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #fff;
      color: #111;
      font-family: Arial, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    .app {
      width: min(900px, calc(100% - 32px));
      margin: 42px auto 32px;
    }
    .status {
      text-align: center;
      font-size: clamp(23px, 3.2vw, 31px);
      line-height: 1.45;
      font-weight: 400;
      margin-bottom: 27px;
    }
    .battle-number, .progress { display: block; }
    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 19px;
      align-items: stretch;
    }
    button {
      background: #fff;
      color: #111;
      border: 2px solid #222;
      border-radius: 0;
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button:focus-visible { outline: 2px solid #777; outline-offset: 3px; }
    .name-choice {
      min-width: 0;
      min-height: 290px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow-wrap: anywhere;
      font-size: clamp(19px, 2.3vw, 24px);
    }
    .middle {
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 10px;
      min-width: 0;
    }
    .middle button {
      min-height: 0;
      padding: 12px 4px;
      font-size: clamp(17px, 2vw, 21px);
    }
    .setup, .finished { text-align: center; }
    .setup { margin-top: 28px; }
    .setup label { display: block; margin-bottom: 10px; }
    textarea {
      width: 100%;
      min-height: 130px;
      padding: 12px;
      border: 1px solid #222;
      border-radius: 0;
      font: 16px/1.5 Arial, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      resize: vertical;
    }
    .action {
      border: 1px solid #222;
      padding: 10px 18px;
      margin-top: 12px;
      font-size: 16px;
    }
    .hint { font-size: 14px; line-height: 1.6; color: #444; }
    .hidden { display: none !important; }
    .finished h2 { font-size: 25px; font-weight: 400; }
    .results { text-align: left; white-space: pre-line; line-height: 1.8; }
    @media (max-width: 600px) {
      .app { width: calc(100% - 24px); margin-top: 28px; }
      .status { margin-bottom: 20px; }
      .choices { gap: 8px; }
      .name-choice { min-height: 220px; padding: 8px; }
      .middle { gap: 8px; }
      .middle button { padding: 8px 2px; font-size: 15px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section id="setup" class="setup">
      <div class="status">Sort</div>
      <label for="names">정렬할 이름을 한 줄에 하나씩 입력해 주세요.</label>
      <textarea id="names" placeholder="김태군&#10;곽도규&#10;이름 3&#10;이름 4"></textarea>
      <div class="hint">이름을 입력한 순서대로 비교를 시작합니다. 이름은 나중에 언제든 바꿔 다시 시작할 수 있어요.</div>
      <button id="start" class="action">소트 시작</button>
    </section>

    <section id="sorter" class="hidden">
      <div class="status">
        <span id="battle" class="battle-number">Battle No.1</span>
        <span id="progress" class="progress">0% sorted.</span>
      </div>
      <div class="choices">
        <button id="left" class="name-choice" aria-label="왼쪽 이름 선택"></button>
        <div class="middle">
          <button id="both">둘 다 좋다</button>
          <button id="skip">모르겠다</button>
        </div>
        <button id="right" class="name-choice" aria-label="오른쪽 이름 선택"></button>
      </div>
      <div style="text-align:center">
        <button id="restart" class="action">처음부터 다시</button>
      </div>
    </section>

    <section id="finished" class="finished hidden">
      <div class="status">Sort complete.</div>
      <h2>정렬 결과</h2>
      <div id="results" class="results"></div>
      <button id="again" class="action">다시 정렬하기</button>
    </section>
  </main>

  <script>
    const setup = document.getElementById('setup');
    const sorter = document.getElementById('sorter');
    const finished = document.getElementById('finished');
    const namesInput = document.getElementById('names');
    const leftButton = document.getElementById('left');
    const rightButton = document.getElementById('right');
    const bothButton = document.getElementById('both');
    const skipButton = document.getElementById('skip');

    let names = [];
    let sorted = [];
    let pending = [];
    let current = null;
    let battleNo = 1;
    let completed = 0;
    let totalComparisons = 0;
    let skipped = [];

    // Stable insertion sort: each choice places a name in the current ranking.
    function beginSort() {
      names = namesInput.value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      if (names.length < 2) {
        alert('이름을 두 개 이상 입력해 주세요.');
        return;
      }
      sorted = [names[0]];
      pending = names.slice(1);
      current = pending.shift();
      battleNo = 1;
      completed = 0;
      currentSearch = null;
      currentPair = null;
      skipped = [];
      totalComparisons = Math.max(1, names.length * (names.length - 1) / 2);
      setup.classList.add('hidden');
      finished.classList.add('hidden');
      sorter.classList.remove('hidden');
      nextComparison();
    }

    function nextComparison() {
      if (!current) {
        showResults();
        return;
      }
      if (sorted.length === 0) {
        sorted.push(current);
        current = pending.shift() || null;
        nextComparison();
        return;
      }
      // Binary insertion search keeps the number of comparisons low.
      if (!currentSearch) {
        currentSearch = { low: 0, high: sorted.length };
      }
      if (currentSearch.low >= currentSearch.high) {
        sorted.splice(currentSearch.low, 0, current);
        current = pending.shift() || null;
        currentSearch = null;
        nextComparison();
        return;
      }
      const mid = Math.floor((currentSearch.low + currentSearch.high) / 2);
      leftButton.textContent = sorted[mid];
      rightButton.textContent = current;
      currentPair = { mid };
      updateStatus();
    }

    let currentSearch = null;
    let currentPair = null;

    function choose(side) {
      if (!currentPair || !currentSearch) return;
      const mid = currentPair.mid;
      if (side === 'left') {
        // The current name ranks below the compared name.
        currentSearch.low = mid + 1;
      } else if (side === 'right') {
        // The current name ranks above the compared name.
        currentSearch.high = mid;
      } else if (side === 'both') {
        // Treat "both are good" as a tie: insert next to the compared name.
        sorted.splice(mid + 1, 0, current);
        current = pending.shift() || null;
        currentSearch = null;
        currentPair = null;
      } else if (side === 'skip') {
        // "Not sure" advances to the next comparison without making a ranking choice.
        // Use the neutral midpoint placement so the sort can continue.
        skipped.push({ name: current, compared: sorted[mid] });
        currentSearch.low = mid + 1;
      }

      completed++;
      battleNo++;
      currentPair = null;
      updateStatus();
      nextComparison();
    }

    function updateStatus() {
      document.getElementById('battle').textContent = `Battle No.${battleNo}`;
      const percent = Math.min(99, Math.floor(completed / totalComparisons * 100));
      document.getElementById('progress').textContent = `${percent}% sorted.`;
    }

    function showResults() {
      sorter.classList.add('hidden');
      finished.classList.remove('hidden');
      document.getElementById('results').textContent =
        sorted.map((name, i) => `${i + 1}. ${name}`).join('\n') +
        (skipped.length ? `\n\n모르겠다 선택: ${skipped.length}회` : '');
    }

    function restartToSetup() {
      sorter.classList.add('hidden');
      finished.classList.add('hidden');
      setup.classList.remove('hidden');
    }

    document.getElementById('start').addEventListener('click', beginSort);
    leftButton.addEventListener('click', () => choose('left'));
    rightButton.addEventListener('click', () => choose('right'));
    bothButton.addEventListener('click', () => choose('both'));
    skipButton.addEventListener('click', () => choose('skip'));
    document.getElementById('restart').addEventListener('click', restartToSetup);
    document.getElementById('again').addEventListener('click', restartToSetup);
  </script>
</body>
</html>
